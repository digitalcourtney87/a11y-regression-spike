name: m3-spa-build
# M3 corpus SPAs (P14, P17, P19; DR-0057, DR-0059): builds each vendored app
# in fixtures/spa/ on the gate runner and probes the production build offline
# with the clock fixed, loading each path twice to check the data are
# deterministic. Dependencies install from the app's lockfile (generated with
# --package-lock-only when the app has none, and uploaded to be committed)
# with install scripts off and a separate npm cache that is never saved; the
# job has contents: read and uses no secrets at all. It runs on pushes to
# m3-corpus that touch the SPAs, the corpus or the probe.
on:
  workflow_dispatch:
  push:
    branches: [m3-corpus]
    paths:
      - .github/workflows/m3-spa-build.yml
      - fixtures/spa/**
      - corpus/**
      - harness/src/probes/spaProbe.ts
permissions:
  contents: read
concurrency:
  group: m3-spa-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  base:
    runs-on: windows-2025 # gates; change only via DECISIONS.md (DR-0006)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: atomic-crm
            build: npx --no-install vite build --config vite.demo.config.ts
            paths: "/,/#/contacts,/#/deals,/#/companies"
          - app: react-admin-simple
            build: npx --no-install vite build
            paths: "/,/#/posts,/#/comments"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install harness dependencies
        run: npm ci
      - name: Install Chrome for Testing 153.0.8010.12 (Playwright 1.63.0)
        run: npx --no-install playwright install chromium
      - name: Install and build the SPA (timed)
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          BUILD: ${{ matrix.build }}
        run: |
          $out = Join-Path $PWD "artefacts/spa/$env:APP"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Build outside the harness tree so the SPA resolves only its own dependencies.
          $work = Join-Path $env:RUNNER_TEMP "spa"
          Copy-Item -Recurse -Force "fixtures/spa/$env:APP" $work
          Set-Location $work
          $env:npm_config_cache = Join-Path $env:RUNNER_TEMP "npm-cache-spa"
          $generated = $false
          if (-not (Test-Path package-lock.json)) {
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | Out-File (Join-Path $out lock.log)
            Copy-Item package-lock.json (Join-Path $out package-lock.json)
            $generated = $true
          }
          $install = [Diagnostics.Stopwatch]::StartNew()
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | Out-File (Join-Path $out install.log)
          $installExit = $LASTEXITCODE
          $install.Stop()
          $build = [Diagnostics.Stopwatch]::StartNew()
          Invoke-Expression "$env:BUILD 2>&1" | Out-File (Join-Path $out build.log)
          $buildExit = $LASTEXITCODE
          $build.Stop()
          [ordered]@{
            app = $env:APP; lockfileGenerated = $generated
            installSeconds = [math]::Round($install.Elapsed.TotalSeconds, 1); installExit = $installExit
            buildSeconds = [math]::Round($build.Elapsed.TotalSeconds, 1); buildExit = $buildExit
            distExists = (Test-Path dist)
          } | ConvertTo-Json | Out-File (Join-Path $out timing.json)
          if ($buildExit -ne 0) { exit $buildExit }
      - name: Probe the build offline with the clock fixed, two loads per path
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
          PATHS: ${{ matrix.paths }}
        run: node harness/src/probes/spaProbe.ts --name "$env:APP" --dist (Join-Path $env:RUNNER_TEMP "spa/dist") --out "artefacts/spa/$env:APP/probe.json" --paths "$env:PATHS" --fixed-time "2026-10-05T09:00:00Z" --repeat 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: spa-base-${{ matrix.app }}
          path: artefacts/spa/
          retention-days: 30
  patches:
    # Applies each item's patch to its app and builds it; a dev item's build is
    # also loaded offline, so a patch that breaks the build or throws at
    # runtime is caught (corpus plan §6). A test-split item's build is never
    # loaded before the freeze: it is applied and built only (hard rule 5,
    # DR-0082). Same safeguards as the base job.
    runs-on: windows-2025 # gates; change only via DECISIONS.md (DR-0006)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [atomic-crm, react-admin-simple]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install harness dependencies
        run: npm ci
      - name: Install Chrome for Testing 153.0.8010.12 (Playwright 1.63.0)
        run: npx --no-install playwright install chromium
      - name: Build and probe each patched app
        shell: pwsh
        env:
          APP: ${{ matrix.app }}
        run: |
          $repo = $PWD
          $out = Join-Path $repo "artefacts/patches/$env:APP"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $work = Join-Path $env:RUNNER_TEMP "spa"
          Copy-Item -Recurse -Force "fixtures/spa/$env:APP" $work
          Push-Location $work
          $env:npm_config_cache = Join-Path $env:RUNNER_TEMP "npm-cache-spa"
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | Out-File (Join-Path $out install.log)
          Pop-Location
          $build = if ($env:APP -eq "atomic-crm") { "npx --no-install vite build --config vite.demo.config.ts" } else { "npx --no-install vite build" }
          $results = @()
          foreach ($file in Get-ChildItem corpus/items -Filter *.json | Sort-Object Name) {
            $item = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if ($item.app -ne $env:APP -or -not $item.candidate.patch) { continue }
            $patch = Join-Path $repo "corpus/patches/$($item.candidate.patch)"
            Push-Location $work
            # Patch paths are a/fixtures/spa/<app>/...; strip four components to apply inside the app copy.
            git apply -p4 $patch 2>&1 | Out-File (Join-Path $out "$($item.id).apply.log")
            $applyExit = $LASTEXITCODE
            Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
            Invoke-Expression "$build 2>&1" | Out-File (Join-Path $out "$($item.id).build.log")
            $buildExit = $LASTEXITCODE
            Pop-Location
            $probeExit = $null
            if ($buildExit -eq 0 -and $item.split -ne "test") {
              node harness/src/probes/spaProbe.ts --name $item.id --dist (Join-Path $work "dist") --out (Join-Path $out "$($item.id).probe.json") --paths "/" --fixed-time "2026-10-05T09:00:00Z"
              $probeExit = $LASTEXITCODE
            }
            Push-Location $work
            git apply -R -p4 $patch 2>&1 | Out-File -Append (Join-Path $out "$($item.id).apply.log")
            $revertExit = $LASTEXITCODE
            Pop-Location
            $results += [ordered]@{ id = $item.id; split = $item.split; applyExit = $applyExit; buildExit = $buildExit; probeExit = $probeExit; revertExit = $revertExit }
          }
          $results | ConvertTo-Json | Out-File (Join-Path $out results.json)
          if ($results | Where-Object { $_.applyExit -ne 0 -or $_.buildExit -ne 0 -or ($null -ne $_.probeExit -and $_.probeExit -ne 0) -or $_.revertExit -ne 0 }) { exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: patches-${{ matrix.app }}
          path: artefacts/patches/
          retention-days: 30
