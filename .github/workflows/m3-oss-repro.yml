name: m3-oss-repro
# M3 mining (DR-0062, DR-0063): builds each fixture in fixtures/oss/ against
# every listed release of the package under test and runs its check, written
# from the issue's own description. Third-party code runs here only with
# contents: read and no secrets at all, install scripts off, and a separate
# npm cache that is never saved. Each release installs with --before set to its
# own publish date plus one day, so it resolves its dependencies as a user
# installing it then would have; the build tools come from their own directory. Runs on pushes to m3-corpus that touch the
# fixtures or the check harness.
on:
  workflow_dispatch:
  push:
    branches: [m3-corpus]
    paths:
      - .github/workflows/m3-oss-repro.yml
      - fixtures/oss/**
      - harness/src/probes/ossCheck.ts
      - harness/src/probes/ossFixture.ts
      - fixtures/oss-tools/**
permissions:
  contents: read
concurrency:
  group: m3-oss-repro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fixtures: ${{ steps.list.outputs.fixtures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "fixtures=$(ls fixtures/oss | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  fixture:
    needs: list
    runs-on: windows-2025 # gates; change only via DECISIONS.md (DR-0006)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.list.outputs.fixtures) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install harness dependencies
        run: npm ci
      - name: Install Chrome for Testing 153.0.8010.12 (Playwright 1.63.0)
        run: npx --no-install playwright install chromium
      - name: Build and check each release
        shell: pwsh
        env:
          ID: ${{ matrix.id }}
        run: |
          $repo = $PWD
          $fixture = Join-Path $repo "fixtures/oss/$env:ID"
          $out = Join-Path $repo "artefacts/oss/$env:ID"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:npm_config_cache = Join-Path $env:RUNNER_TEMP "npm-cache-oss"
          $tools = Join-Path $env:RUNNER_TEMP "oss-tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          '{"private":true,"dependencies":{"vite":"8.3.2","@vitejs/plugin-react":"6.0.1"}}' | Out-File -Encoding utf8NoBOM (Join-Path $tools "package.json")
          Copy-Item fixtures/oss-tools/ossBuild.mjs $tools
          npm install --prefix $tools --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "build tools install failed" }
          $meta = Get-Content (Join-Path $fixture "fixture.json") -Raw | ConvertFrom-Json
          $times = npm view $meta.package time --json | ConvertFrom-Json -AsHashtable
          $results = @()
          foreach ($version in $meta.versions) {
            $before = ([datetime]$times[$version]).ToUniversalTime().AddDays(1).ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            $work = Join-Path $env:RUNNER_TEMP "oss-$version"
            node harness/src/probes/ossFixture.ts --fixture $fixture --version $version --out $work
            Push-Location $work
            npm install --ignore-scripts --no-audit --no-fund "--before=$before" 2>&1 | Out-File (Join-Path $out "$version.install.log")
            $installExit = $LASTEXITCODE
            Copy-Item package-lock.json (Join-Path $out "$version.package-lock.json") -ErrorAction SilentlyContinue
            Pop-Location
            node (Join-Path $tools "ossBuild.mjs") $work $meta.stack 2>&1 | Out-File (Join-Path $out "$version.build.log")
            $buildExit = $LASTEXITCODE
            if ($buildExit -eq 0) {
              node harness/src/probes/ossCheck.ts --dist (Join-Path $work "dist") --check (Join-Path $fixture "check.mjs") --version $version --out (Join-Path $out "$version.check.json")
            }
            $results += [ordered]@{ version = $version; before = $before; installExit = $installExit; buildExit = $buildExit }
          }
          $results | ConvertTo-Json | Out-File (Join-Path $out "builds.json")
          # A release that fails to install or build is recorded in builds.json, not as a job failure.
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oss-${{ matrix.id }}
          path: artefacts/oss/
          retention-days: 30
