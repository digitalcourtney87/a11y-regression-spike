name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate M8 script syntax and log paths without building fixtures
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('harness/src/runner/calibrationBuild.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $logRoot = ./harness/src/runner/calibrationBuild.ps1 -Out artefacts/m8-path-proof/builds -Evidence artefacts/m8-path-proof/evidence -ValidatePathsOnly
          if (-not [System.IO.Path]::IsPathRooted($logRoot)) { throw 'M8 log root must remain absolute after switching into a fixture work directory' }
          $work = Join-Path $env:RUNNER_TEMP 'm8-path-proof-work'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Push-Location $work
          try { 'path regression check' | Out-File (Join-Path $logRoot 'probe.log') } finally { Pop-Location }
          if (-not (Test-Path artefacts/m8-path-proof/evidence/build-logs/probe.log)) { throw 'M8 log was redirected by the fixture working directory' }
          $request = Join-Path $env:RUNNER_TEMP 'm8-recovery-path-proof.json'
          '{"approval":"DR-0116","dispatches":1,"jobs":2,"timeoutMinutes":60,"repetitions":3,"cases":["bootstrap-modal","vuetify-input","calendar","multiselect"]}' | Out-File -Encoding utf8NoBOM $request
          ./harness/src/runner/calibrationBuild.ps1 -Out artefacts/m8-path-proof/builds -Evidence artefacts/m8-path-proof/evidence -ValidatePathsOnly -RecoveryRequest $request | Out-Null
      - run: npm test
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Build the B2 listener (Windows targeting on Linux; DR-0019)
        run: dotnet build listener/Listener.csproj -c Release -warnaserror
