name: m8-calibration
# P40/DR-0114: one dispatch, two Windows jobs, no retry or candidate build.
on:
  push:
    branches: ["codex/m8-calibration-pilot"]
    paths: [.github/m8-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m8-calibration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  calibration:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        leg: [nvda-absent, nvda-present]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install harness dependencies
        run: npm ci
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.leg == 'nvda-absent'
        with:
          dotnet-version: 10.0.401
      - name: Build the existing listener
        if: matrix.leg == 'nvda-absent'
        run: dotnet build listener/Listener.csproj -c Release -warnaserror
      - name: Install pinned virtual audio
        shell: pwsh
        run: ./harness/src/probes/scream.ps1 -Lock env/env.lock.json -OutDir artefacts/calibration
      - name: Snapshot the environment
        shell: pwsh
        run: ./harness/src/probes/env.ps1 -Out artefacts/calibration/env.json
      - name: Install pinned Chrome
        run: npx --no-install playwright install chromium
      - name: Install pinned NVDA
        if: matrix.leg == 'nvda-present'
        run: npx --no-install guidepup install
      - name: Build owned controls and pinned working releases only
        shell: pwsh
        run: ./harness/src/runner/calibrationBuild.ps1 -Out builds -Evidence artefacts/calibration
      - name: Run the predeclared base-only calibration cases once
        env:
          LEG: ${{ matrix.leg }}
        run: node harness/src/runner/calibrationRun.ts --leg "$env:LEG" --out artefacts/calibration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: m8-calibration-${{ matrix.leg }}
          path: artefacts/calibration/
          retention-days: 30
