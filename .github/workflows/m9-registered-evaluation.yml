name: m9-registered-evaluation
# P42/DR-0120: one dispatch of the registered owned controls; P40 and P41 remain disabled.
on:
  push:
    branches: ["claude/m9-registered-evaluation"]
    paths: [.github/m9-request.json]
permissions:
  contents: read
concurrency:
  group: m9-registered-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  calibration:
    # P42 consumed by run 38315343825; no further dispatch is authorised.
    if: ${{ false }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        leg: [nvda-absent, nvda-present]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install harness dependencies
        run: npm ci
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.leg == 'nvda-absent'
        with:
          dotnet-version: 10.0.401
      - name: Build the existing listener
        if: matrix.leg == 'nvda-absent'
        run: dotnet build listener/Listener.csproj -c Release -warnaserror
      - name: Install pinned virtual audio
        shell: pwsh
        run: ./harness/src/probes/scream.ps1 -Lock env/env.lock.json -OutDir artefacts/calibration
      - name: Snapshot the environment
        shell: pwsh
        run: ./harness/src/probes/env.ps1 -Out artefacts/calibration/env.json
      - name: Install pinned Chrome
        run: npx --no-install playwright install chromium
      - name: Install pinned NVDA
        if: matrix.leg == 'nvda-present'
        run: npx --no-install guidepup install
      - name: Copy the registered owned controls only
        shell: pwsh
        run: ./harness/src/runner/calibrationBuild.ps1 -Out builds -Evidence artefacts/calibration -P42Request .github/m9-request.json
      - name: Run the registered base-only cases once
        env:
          LEG: ${{ matrix.leg }}
        run: node harness/src/runner/calibrationRun.ts --leg "$env:LEG" --out artefacts/calibration --p42-request .github/m9-request.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: m9-registered-evaluation-${{ matrix.leg }}
          path: artefacts/calibration/
          retention-days: 30
